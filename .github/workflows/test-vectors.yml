name: Cross-language test vectors

# Runs the .NET, TypeScript and Python test suites against test-vectors/arc76-vectors.json.
# Deliberately does NOT publish anything - the publish-*.yml workflows are path-triggered on
# their own language folder only, so a vectors-only change never ships a package. This workflow
# is what enforces that all languages agree on the shared known-answer data.
on:
  push:
    branches: [master]
    paths:
      - "test-vectors/**"
      - ".github/workflows/test-vectors.yml"
  pull_request:
    paths:
      - "test-vectors/**"
      - ".github/workflows/test-vectors.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test dotnet/AlgorandARC76AccountDotNet.sln --configuration Release

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: typescript/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - working-directory: typescript
        run: |
          pnpm install --frozen-lockfile
          pnpm -r run build
          pnpm -r run test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install and test every package
        working-directory: python/packages
        run: |
          python -m pip install --upgrade pip pytest
          # arc76-core first (other packages depend on it); local path so unreleased core changes are tested.
          python -m pip install -e ./core
          for pkg in core algorand ethereum bitcoin bitcoincash solana; do
            extras=""
            if [ "$pkg" = "algorand" ]; then extras="[falcon]"; fi
            python -m pip install -e "./$pkg$extras"
            (cd "$pkg" && python -m pytest)
          done
