name: Publish NuGet packages

# Only runs when dotnet/ actually changed - changes under audits/ (or typescript/, python/,
# root docs) never trigger this. Within that, if anything that ships in a nupkg changed, ALL
# six packages are packed and pushed together at one version, Core first (see "Determine
# changed packages" below for why per-project publishing is unsafe).
on:
  push:
    branches: [master]
    paths:
      - "dotnet/**"
      - ".github/workflows/publish-nuget.yml"
  workflow_dispatch: {}

permissions:
  contents: read

# Never run two publishes at once: interleaved pushes of different versions could leave the
# registry's latest Core/chain packages inconsistent.
concurrency:
  group: publish-nuget
  cancel-in-progress: false

jobs:
  publish:
    name: Build, test, pack, and publish packages
    runs-on: ubuntu-latest
    # Optional: lets you require manual approval / scope secrets to this environment in repo
    # settings. If you don't want that, delete this line - and if your nuget.org Trusted
    # Publishing policy has an Environment set, it must match (or be blank if removed here).
    environment: release
    permissions:
      id-token: write # required to obtain the GitHub OIDC token for NuGet Trusted Publishing
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # full history, needed to diff against github.event.before

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      # Versioning (see dotnet/AGENTS.md "Versioning"): the *package* version is
      # 1.0.{increment}.{yyyyMMddHH} so the exact publish date/hour is readable straight off
      # the version number. AssemblyVersion/FileVersion use 1.0.{increment}.{MMdd} instead,
      # since those are System.Version UInt16 fields (max 65535) and the full 10-digit
      # timestamp would overflow that. {increment} is this workflow's run number, which only
      # ever increases.
      - name: Compute version
        id: version
        run: |
          INCREMENT="${{ github.run_number }}"
          FULL_DATE=$(date -u +%Y%m%d%H)
          SHORT_DATE=$(date -u +%m%d)
          echo "version=1.0.${INCREMENT}.${FULL_DATE}" >> "$GITHUB_OUTPUT"
          echo "assembly_version=1.0.${INCREMENT}.${SHORT_DATE}" >> "$GITHUB_OUTPUT"
          echo "Package version: 1.0.${INCREMENT}.${FULL_DATE} (assembly/file version: 1.0.${INCREMENT}.${SHORT_DATE})"

      - name: Restore
        working-directory: dotnet
        run: dotnet restore

      - name: Build
        working-directory: dotnet
        run: >
          dotnet build --configuration Release --no-restore
          -p:Version=${{ steps.version.outputs.version }}
          -p:AssemblyVersion=${{ steps.version.outputs.assembly_version }}
          -p:FileVersion=${{ steps.version.outputs.assembly_version }}

      - name: Test
        working-directory: dotnet
        run: dotnet test --configuration Release --no-build

      # All six packages are packed+pushed together, at one version, whenever anything that ships
      # in a nupkg changed (any file under dotnet/ except tests and agent/AI docs). Deliberate:
      # each chain nupkg pins ARC76Account.Core to an EXACT version equal to its own, and NuGet
      # resolves the *lowest* matching version. Publishing only the changed project therefore
      # either leaves a chain package on an old, unfixed Core (audit #2, 2026-08-03) or makes it
      # depend on a Core version that was never published and is uninstallable (audit #4,
      # 2026-10-19: ARC76Account.Algorand 1.0.5/1.0.6 -> NU1102). Do not revert to per-project
      # change detection. Test-only / AGENTS.md / AI_INTEGRATION.md changes publish nothing.
      - name: Determine changed packages
        id: changed
        working-directory: dotnet
        run: |
          PROJECTS=(Core Algorand Ethereum Bitcoin BitcoinCash Solana)
          BEFORE="${{ github.event.before }}"
          : > /tmp/changed-projects.txt
          FORCE_ALL=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            FORCE_ALL=true
          elif ! git diff --quiet "$BEFORE" "${{ github.sha }}" -- . ':(exclude)TestARC76' ':(exclude)AGENTS.md' ':(exclude)AI_INTEGRATION.md'; then
            FORCE_ALL=true
          fi
          if [ "$FORCE_ALL" = "true" ]; then
            for name in "${PROJECTS[@]}"; do
              echo "ARC76Account.$name" >> /tmp/changed-projects.txt
            done
          fi
          echo "Projects to publish:"
          cat /tmp/changed-projects.txt

      - name: Pack packages
        working-directory: dotnet
        run: |
          mkdir -p ../artifacts
          while IFS= read -r proj; do
            [ -z "$proj" ] && continue
            dotnet pack "$proj/$proj.csproj" --configuration Release --no-build \
              -p:Version=${{ steps.version.outputs.version }} \
              -p:AssemblyVersion=${{ steps.version.outputs.assembly_version }} \
              -p:FileVersion=${{ steps.version.outputs.assembly_version }} \
              --output ../artifacts
          done < /tmp/changed-projects.txt
          ls -la ../artifacts || true

      # Pre-publish smoke test: every packed chain package must restore from the freshly packed
      # artifacts (plus nuget.org for third-party deps), proving its exact ARC76Account.Core pin
      # is satisfied by the Core packed in this same run - BEFORE anything is pushed. Only a local
      # consistency check (not a registry check); Core is pushed first below. net10.0 only.
      - name: Verify packed packages restore
        if: hashFiles('artifacts/*.nupkg') != ''
        run: |
          set -e
          ART="$(pwd)/artifacts"
          VER="${{ steps.version.outputs.version }}"
          for f in "$ART"/ARC76Account.*."$VER".nupkg; do
            id=$(basename "$f" ".$VER.nupkg")
            if [ "$id" = "ARC76Account.Core" ]; then continue; fi
            dir=$(mktemp -d)
            cd "$dir"
            dotnet new classlib -n smoke -f net10.0
            cd smoke
            dotnet add package "$id" --version "$VER" \
              --source "$ART" --source https://api.nuget.org/v3/index.json
            echo "OK: $id $VER restores"
            cd "$GITHUB_WORKSPACE"
          done

      # See https://learn.microsoft.com/nuget/nuget-org/trusted-publishing
      # Configure a Trusted Publishing policy on nuget.org (per package, or account-wide) with:
      #   Repository Owner: scholtz | Repository: ARC76Account | Workflow File: publish-nuget.yml
      # NUGET_USER is a repo/environment secret holding your nuget.org *username* (not email).
      - name: NuGet login (OIDC -> short-lived API key)
        if: hashFiles('artifacts/*.nupkg') != ''
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # Core is pushed FIRST (once), then the rest: every chain package pins Core to its own exact
      # version, so Core must exist on the registry before the packages depending on it.
      - name: Push
        if: hashFiles('artifacts/*.nupkg') != ''
        run: |
          set -e
          push() {
            dotnet nuget push "$1" \
              --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          }
          core=$(ls artifacts/ARC76Account.Core.*.nupkg 2>/dev/null | head -n1 || true)
          if [ -z "$core" ]; then
            echo "ARC76Account.Core was not packed - refusing to push chain packages that pin it" >&2
            exit 1
          fi
          push "$core"
          for f in artifacts/*.nupkg; do
            case "$f" in artifacts/ARC76Account.Core.*) continue ;; esac
            push "$f"
          done
