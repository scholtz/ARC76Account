name: Publish PyPI packages

# Only runs when python/ actually changed - changes under audits/ (or dotnet/, typescript/,
# root docs) never trigger this. Within that, each package is only built/published if that
# specific package's own folder changed (see "Check if this package's files changed" below) -
# e.g. a Bitcoin-only change does not republish Algorand/Ethereum/BitcoinCash/Solana/Core.
on:
  push:
    branches: [master]
    paths:
      - "python/**"
      - ".github/workflows/publish-pypi.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    name: Build, test, and publish (arc76-${{ matrix.package }})
    runs-on: ubuntu-latest
    # Optional: lets you require manual approval in repo settings. If your pypi.org Trusted
    # Publishing policy for this package has an Environment set, it must match this (or be
    # blank if you remove this line).
    environment: release
    permissions:
      id-token: write # required to obtain the GitHub OIDC token for PyPI Trusted Publishing
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: [core, algorand, ethereum, bitcoin, bitcoincash, solana]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # full history, needed to diff against github.event.before

      # Every dependent package also gets republished whenever arc76-core changed - not just
      # when its own folder changed, mirroring publish-npm.yml's handling of @arc76/core (see
      # that workflow's comment, and audits/2026-08-03-audit-report-2.md) - each dependent's
      # pyproject.toml declares an unpinned lower-bound dependency ("arc76-core>=1.0.0"), so
      # republishing core alone would leave every already-published dependent installable but
      # silently stuck on the old core's behavior, or (worse) core never getting published at
      # all while dependents that need it do.
      - name: Check if this package's files changed
        id: changed
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" "${{ github.sha }}" -- "python/packages/${{ matrix.package }}/" "python/packages/core/"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.changed.outputs.changed == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tooling
        if: steps.changed.outputs.changed == 'true'
        run: python -m pip install --upgrade pip build

      # Versioning (see python/AGENTS.md "Versioning & release process"): PyPI's PEP 440
      # release segment, like semver, has no 4th "date" dotted segment - so this uses the same
      # scheme as publish-npm.yml, 1.{increment}.{yyyyMMddHH} (run number in the minor slot,
      # plain publish timestamp in the patch slot), not dotnet's 4-segment
      # 1.0.{increment}.{yyyyMMddHH}.
      - name: Compute version
        if: steps.changed.outputs.changed == 'true'
        id: version
        run: |
          INCREMENT="${{ github.run_number }}"
          FULL_DATE=$(date -u +%Y%m%d%H)
          VERSION="1.${INCREMENT}.${FULL_DATE}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      # The committed pyproject.toml always has version = "1.0.0" (a placeholder for local dev
      # - see python/AGENTS.md) - this overwrites it in the checkout only, never committed back.
      - name: Set package version
        if: steps.changed.outputs.changed == 'true'
        working-directory: python/packages/${{ matrix.package }}
        run: |
          sed -i "s/^version = \"1.0.0\"$/version = \"${{ steps.version.outputs.version }}\"/" pyproject.toml
          grep '^version' pyproject.toml

      # Install this package's own dependencies (including arc76-core from PyPI, if this isn't
      # core itself) plus pytest, so tests run against exactly what a real `pip install` would
      # resolve - not a local path override.
      - name: Install package and test dependencies
        if: steps.changed.outputs.changed == 'true'
        working-directory: python/packages/${{ matrix.package }}
        run: python -m pip install -e . pytest

      - name: Test
        if: steps.changed.outputs.changed == 'true'
        working-directory: python/packages/${{ matrix.package }}
        run: python -m pytest

      - name: Build sdist and wheel
        if: steps.changed.outputs.changed == 'true'
        working-directory: python/packages/${{ matrix.package }}
        run: python -m build --outdir dist

      # See https://docs.pypi.org/trusted-publishers/
      # Configure a Trusted Publisher on pypi.org for each arc76-* project (can be added as a
      # "pending" publisher before the project has ever been published) with:
      #   Owner: scholtz | Repository: ARC76Account | Workflow: publish-pypi.yml
      #   Environment: release (or blank if you removed the environment: line above)
      - name: Publish to PyPI
        if: steps.changed.outputs.changed == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: python/packages/${{ matrix.package }}/dist
