name: Publish npm packages

# Only runs when typescript/ actually changed - changes under audits/ (or dotnet/, python/,
# root docs) never trigger this. Within that, each package is only built/published if that
# specific package's own folder changed (see "Check if this package's files changed" below) -
# e.g. a Bitcoin-only change does not republish Algorand/Ethereum/BitcoinCash/Solana/Core.
on:
  push:
    branches: [master]
    paths:
      - "typescript/**"
      - ".github/workflows/publish-npm.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    name: Build, test, and publish (@arc76/${{ matrix.package }})
    runs-on: ubuntu-latest
    # Optional: lets you require manual approval / scope secrets to this environment in repo
    # settings. If you use it, add NPM_TOKEN as an *environment* secret on "release" rather
    # than (or in addition to) a repo secret. Remove this line if you don't want the gate.
    environment: release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: [core, algorand, ethereum, bitcoin, bitcoincash, solana]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # full history, needed to diff against github.event.before

      # A dependent package (e.g. @arc76/bitcoin) does NOT get republished just because
      # @arc76/core changed - its already-published version keeps depending on whatever core
      # version range it declares. Bump/republish a dependent explicitly if it needs a newer
      # core.
      - name: Check if this package's files changed
        id: changed
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" "${{ github.sha }}" -- "typescript/packages/${{ matrix.package }}/"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # There is no repo-root package.json (the pnpm workspace root is typescript/), so the
      # action must be pointed at typescript/package.json explicitly - otherwise it looks for
      # "packageManager" in a repo-root package.json that doesn't exist and fails with
      # "No pnpm version is specified."
      - name: Setup pnpm
        if: steps.changed.outputs.changed == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: typescript/package.json

      - name: Setup Node
        if: steps.changed.outputs.changed == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install workspace dependencies
        if: steps.changed.outputs.changed == 'true'
        working-directory: typescript
        run: pnpm install --frozen-lockfile

      # Every chain package depends on @arc76/core's *built* dist/ output (workspace packages
      # resolve each other via package.json main/types, not TS source) - build it first
      # regardless of which package this matrix job is publishing.
      - name: Build @arc76/core
        if: steps.changed.outputs.changed == 'true'
        working-directory: typescript
        run: pnpm --filter @arc76/core build

      - name: Build @arc76/${{ matrix.package }}
        if: steps.changed.outputs.changed == 'true'
        working-directory: typescript
        run: pnpm --filter @arc76/${{ matrix.package }} build

      - name: Test @arc76/${{ matrix.package }}
        if: steps.changed.outputs.changed == 'true'
        working-directory: typescript
        run: pnpm --filter @arc76/${{ matrix.package }} test

      # Versioning (see typescript/AGENTS.md "Versioning"): semver's release core only allows
      # three dot-separated numeric segments (no 4th "date" segment like the .NET side uses),
      # and semver build-metadata (+...) suffixes are unreliable - some tooling strips them, so
      # the date wouldn't reliably survive. Instead the minor segment is the run increment and
      # the patch segment is the plain yyyyMMddHH timestamp (e.g. run 3 published 2026-08-03
      # 18:00 UTC -> 1.3.2026080318) - still a perfectly ordinary, always-increasing semver
      # version, but the patch digits are always this exact, parseable timestamp.
      - name: Compute version
        if: steps.changed.outputs.changed == 'true'
        id: version
        run: |
          INCREMENT="${{ github.run_number }}"
          FULL_DATE=$(date -u +%Y%m%d%H)
          VERSION="1.${INCREMENT}.${FULL_DATE}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Set package version
        if: steps.changed.outputs.changed == 'true'
        working-directory: typescript/packages/${{ matrix.package }}
        run: pnpm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version --no-git-checks

      # Use `pnpm pack` (not `npm pack`) so the "@arc76/core": "workspace:^" dependency range
      # gets rewritten to a real semver range in the tarball's package.json - npm doesn't
      # understand the workspace: protocol at all.
      - name: Pack
        if: steps.changed.outputs.changed == 'true'
        working-directory: typescript/packages/${{ matrix.package }}
        run: pnpm pack --pack-destination /tmp/arc76-pack

      # Classic token-based publish (not Trusted Publishing/OIDC): NPM_TOKEN must be an npm
      # "Automation" access token with publish rights on the @arc76 org, stored as a GitHub
      # secret. See the "GitHub secrets setup" doc (docs/github-secrets-setup.md) for how to
      # create both. actions/setup-node's registry-url above wires NODE_AUTH_TOKEN into a
      # generated .npmrc automatically - we don't need to write one by hand.
      - name: Publish
        if: steps.changed.outputs.changed == 'true'
        working-directory: typescript/packages/${{ matrix.package }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish /tmp/arc76-pack/*.tgz --access public
