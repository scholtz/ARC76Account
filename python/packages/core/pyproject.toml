[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arc76-core"
version = "1.0.0"
description = "Shared ARC76 (PBKDF2-HMAC-SHA256) seed derivation used by the per-chain arc76-* packages (arc76-algorand, arc76-ethereum, arc76-bitcoin, arc76-bitcoincash, arc76-solana). https://github.com/algorandfoundation/ARCs/blob/main/ARCs/arc-0076.md"
readme = "README.md"
license = "MIT"
authors = [{ name = "Ludovit Scholtz" }]
requires-python = ">=3.9"
keywords = ["arc76", "cryptography", "account generation", "pbkdf2"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/scholtz/ARC76Account"
Repository = "https://github.com/scholtz/ARC76Account"
Issues = "https://github.com/scholtz/ARC76Account/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/arc76"]

[tool.pytest.ini_options]
testpaths = ["tests"]
